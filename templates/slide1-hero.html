<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 1</title>
<link rel="stylesheet" href="{{STYLE_PATH}}">
<style>
* { box-sizing: border-box; }
html, body { width: 1080px; height: {{HEIGHT}}px; overflow: hidden; }
.slide { width: 1080px; height: {{HEIGHT}}px; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 60px 40px; position: relative; }
.product-image-area { position: absolute; right: 0; top: 0; width: 45%; height: 100%; overflow: hidden; }
.product-image-area img { width: 100%; height: 100%; object-fit: contain; object-position: center; padding: 60px 40px; }
.product-image-overlay { position: absolute; left: 0; top: 0; width: 65%; height: 100%; background: linear-gradient(to right, var(--bg-primary) 55%, transparent 100%); }
.content { position: relative; z-index: 2; max-width: 55%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.top-section { display: flex; flex-direction: column; gap: 20px; padding-top: 10px; }
.middle-section { display: flex; flex-direction: column; gap: 16px; }
.bottom-section { display: flex; flex-direction: column; gap: 8px; }
.scarcity { font-size: 13px; color: var(--text-secondary); letter-spacing: 1px; text-transform: uppercase; }
.divider { width: 40px; height: 2px; background: var(--accent); margin: 8px 0; }
</style>
</head>
<body class="bg-gradient">
<div class="slide">
  {{#if PRODUKTBILD_URL}}
  <div class="product-image-area">
    <img src="{{PRODUKTBILD_URL}}" alt="{{PRODUKTNAME}}" onerror="this.style.display='none'">
  </div>
  <div class="product-image-overlay"></div>
  {{/if}}
  <div class="content">
    <div class="top-section">
      <div><span class="brand-tag">{{MODE_LABEL}}</span></div>
      <div>
        <div class="product-name">{{HEADLINE}}</div>
        <div class="product-variant">{{SUBHEADLINE}}</div>
      </div>
    </div>
    <div class="middle-section">
      <div class="discount-badge">{{RABATT}}</div>
      <div class="scarcity">{{VERFUEGBARKEIT}}</div>
      <div class="divider"></div>
      <div class="geil-oder-tag">Geil oder?</div>
    </div>
    <div class="bottom-section">
      <div><span class="cta-button">{{HERO_CTA}}</span></div>
      <div class="footer-link">{{FOOTER_LINK}}</div>
    </div>
  </div>
</div>
</body>
</html>
