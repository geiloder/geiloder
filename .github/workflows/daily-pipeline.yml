name: Daily Deal Pipeline

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC = 13:00 DE (Sommer) / 12:00 DE (Winter)
  workflow_dispatch:       # Manuell triggern möglich

env:
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pipeline:
    name: Import → Score → Copy Prep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate pipeline secrets
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Import Open Food Facts discovery products
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENFOODFACTS_QUERIES: ${{ vars.OPENFOODFACTS_QUERIES }}
          OPENFOODFACTS_PAGE_SIZE: ${{ vars.OPENFOODFACTS_PAGE_SIZE }}
          OPENFOODFACTS_TARGET_COUNT: ${{ vars.OPENFOODFACTS_TARGET_COUNT }}
          OPENFOODFACTS_MAX_PAGES: ${{ vars.OPENFOODFACTS_MAX_PAGES }}
          OPENFOODFACTS_USER_AGENT: ${{ vars.OPENFOODFACTS_USER_AGENT }}
        run: npm run import:openfoodfacts

      - name: Score deals
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run score

      - name: Generate copy (Groq)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate:copy

      - name: Pipeline summary
        if: always()
        run: |
          echo "Pipeline completed at $(date)"
          echo "Check admin dashboard: https://geiloder.vercel.app/admin"
