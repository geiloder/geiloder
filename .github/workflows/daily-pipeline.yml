name: Daily Deal Pipeline

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC = 06:00 DE (Winter) / 07:00 DE (Sommer)
  workflow_dispatch:       # Manuell triggern möglich

env:
  NODE_VERSION: '20'

jobs:
  pipeline:
    name: Import → Score → Copy → Render
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Import Awin feeds
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AWIN_FEED_URLS: ${{ secrets.AWIN_FEED_URLS }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_DEFAULT_PROVISION: '5'
        run: npm run import:awin
        continue-on-error: true

      - name: Import ADCELL feeds
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADCELL_FEED_URL: ${{ secrets.ADCELL_FEED_URL }}
        run: npm run import:adcell
        continue-on-error: true

      - name: Import Open Food Facts discovery products
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENFOODFACTS_QUERIES: ${{ vars.OPENFOODFACTS_QUERIES }}
          OPENFOODFACTS_PAGE_SIZE: ${{ vars.OPENFOODFACTS_PAGE_SIZE }}
          OPENFOODFACTS_USER_AGENT: ${{ vars.OPENFOODFACTS_USER_AGENT }}
        run: npm run import:openfoodfacts
        continue-on-error: true

      - name: Score deals
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run score

      - name: Generate copy (Groq)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate:copy

      - name: Render slides (Playwright)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run render

      - name: Pipeline summary
        if: always()
        run: |
          echo "Pipeline completed at $(date)"
          echo "Check admin dashboard: https://geiloder.vercel.app/admin"
